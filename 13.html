<html>
<head>
    <title>Nested Table Example</title>
   </head>
<body>

<h2>Nested Table Example</h2>

<table border="1">
    <tr>
        <th>Name</th>
        <th>Details</th>
    </tr>
    <tr>
        <td>John</td>
        <td>
            <table border="1">
                <tr>
                    <th>Age</th>
                    <th>City</th>
                </tr>
                <tr>
                    <td>22</td>
                    <td>New York</td>
                </tr>
            </table>
        </td>
    </tr>
    <tr>
        <td>Emma</td>
        <td>
            <table border="1">
                <tr>
                    <th>Age</th>
                    <th>City</th>
                </tr>
                <tr>
                    <td>24</td>
                    <td>London</td>
                </tr>
            </table>
        </td>
    </tr>
</table>

</body>
</html>
